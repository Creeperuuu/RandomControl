name: Build RandomControl

on:
  push:
    branches:
      - main
      - "port/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew clean build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/RandomControl-26.2.jar
          archive: false
          if-no-files-found: error
